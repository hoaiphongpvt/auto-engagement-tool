name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: npm run check

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # config.json trên server là config thật (khác repo) — backup trước khi reset
            if [ -f config.json ]; then cp config.json /tmp/fb-bot-config.json.bak; fi
            git fetch origin main
            git reset --hard origin/main
            if [ -f /tmp/fb-bot-config.json.bak ]; then cp /tmp/fb-bot-config.json.bak config.json; fi
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js
            pm2 save
